name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Also run unit tests
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore signing keystore
        id: keystore
        if: env.SIGNING_KEYSTORE != ''
        run: |
          printf '%s' "$SIGNING_KEYSTORE" | base64 -d > "$RUNNER_TEMP/live-translate.keystore"
          echo "file=$RUNNER_TEMP/live-translate.keystore" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        if: github.event_name != 'workflow_dispatch' || inputs.run_tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          SIGN_ARGS=()
          if [ -f "$RUNNER_TEMP/live-translate.keystore" ]; then
            SIGN_ARGS+=(
              -PKEYSTORE_FILE="$RUNNER_TEMP/live-translate.keystore"
              -PKEYSTORE_PASSWORD="$SIGNING_KEYSTORE_PASSWORD"
              -PKEY_ALIAS="$SIGNING_KEY_ALIAS"
              -PKEY_PASSWORD="$SIGNING_KEY_PASSWORD"
            )
          fi
          ./gradlew :app:assembleDebug "${SIGN_ARGS[@]}" --stacktr
